<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E223D" />
      <stop offset="100%" stop-color="#060D18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle with border -->
  <rect width="64" height="64" rx="16" fill="url(#darkBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.9"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6"/>

  <!-- Academic / Excellence Cap on top of M -->
  <path d="M32 12 L44 17 L32 22 L20 17 Z" fill="url(#goldGrad)" />
  <path d="M41 18.5 L41 24 C41 25.5 37 27 32 27 C27 27 23 25.5 23 24 L23 18.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M43 17.5 L45 25" fill="none" stroke="#F3E5AB" stroke-width="1" stroke-linecap="round"/>
  <circle cx="45" cy="25.5" r="1" fill="#F3E5AB"/>

  <!-- Main Monogram "M" -->
  <text x="32" y="49" 
        font-family="'Playfair Display', 'Times New Roman', serif, Georgia" 
        font-size="29" 
        font-weight="900" 
        text-anchor="middle" 
        fill="url(#goldGrad)"
        filter="url(#glow)">M</text>

  <!-- Small star accent at bottom -->
  <polygon points="32,53 33.2,56.5 36.8,56.5 33.9,58.6 35,62 32,59.9 29,62 30.1,58.6 27.2,56.5 30.8,56.5" fill="url(#goldGrad)"/>
</svg>
